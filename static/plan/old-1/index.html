<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map Plan Editor</title>
    <link rel="stylesheet" href="/static/assets/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* استایل‌های خاص همین صفحه اگر نیاز بود */
        .controls { display: flex; gap: 10px; align-items: center; }
        .controls input[type="file"] { padding: 6px; background: white; }
    </style>
</head>
<body>
    <div class="container layout">
        <!-- پنل اصلی -->
        <div class="card">
            <h2><i class="fa-solid fa-map-location-dot" style="color: var(--primary);"></i> Interactive Map Editor</h2>
            
            <div class="sliders">
                <div>
                    <label>Brightness <span id="brightnessVal">100%</span></label>
                    <input type="range" id="brightness" min="0" max="200" value="100" oninput="updatePreview()">
                </div>
                <div>
                    <label>Contrast <span id="contrastVal">100%</span></label>
                    <input type="range" id="contrast" min="0" max="300" value="100" oninput="updatePreview()">
                </div>
            </div>

            <div class="controls" style="margin-bottom: 1.5rem;">
                <input type="file" id="mapFile" accept="image/*">
                <button class="btn btn-primary" onclick="detectWalls()"><i class="fa-solid fa-wand-magic-sparkles"></i> Detect Walls</button>
                <button class="btn btn-success" id="detectRoomBtn" onclick="detectRooms()"><i class="fa-solid fa-crop-simple"></i> Detect Rooms</button>
                <button class="btn btn-secondary" onclick="clearAll()"><i class="fa-solid fa-trash-can"></i> Clear</button>
            </div>

            <div class="canvas-wrapper" id="canvasWrapper">
                <canvas id="previewCanvas"></canvas>
            </div>

            <div style="margin-top: 1.5rem; display: flex; gap: 1rem; justify-content: flex-end;">
                <button class="btn btn-primary" onclick="saveProjectData()"><i class="fa-solid fa-floppy-disk"></i> Save Project</button>
                <a id="downloadLink" class="btn btn-success" style="display:none;" onclick="exportSh3d(event)"><i class="fa-solid fa-file-export"></i> Export .sh3d</a>
                <a id="report" class="btn btn-success" href="/project/{{ project_id }}/report"><i class="fa-solid fa-file-export"></i> Report</a>
            </div>
            <div id="status"></div>
        </div>

        <!-- پنل دیباگ و لیست -->
        <div class="debug-panel">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; padding-bottom:10px; border-bottom:1px solid #334155;">
                <span style="font-weight:600; color:white;"><i class="fa-solid fa-terminal"></i> OBJECT LIST</span>
                <span id="wallCountBadge" style="background:#334155; color:#94a3b8; padding:4px 10px; border-radius:20px; font-size:0.75rem;">0 walls</span>
            </div>
            
            <div style="color: #60a5fa; margin: 1.5rem 0 0.5rem 0; text-transform: uppercase; font-size: 0.75rem; font-weight: 700; letter-spacing: 1px;">Detected Walls</div>
            <div id="wallsList"></div>

            <div style="color: #60a5fa; margin: 1.5rem 0 0.5rem 0; text-transform: uppercase; font-size: 0.75rem; font-weight: 700; letter-spacing: 1px;">Detected Rooms</div>
            <div id="roomsList"></div>
        </div>
    </div>

    <!-- Room Info Popup -->
    <div id="roomInfoModal" class="modal-overlay" style="display:none;">
        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
                <h3 id="roomInfoTitle" style="margin:0;"><i class="fa-solid fa-door-open"></i> Room Details</h3>
                <button onclick="closeRoomInfo()" style="background:none; border:none; font-size:1.2rem; cursor:pointer; color:var(--text-muted);"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div id="roomInfoContent" style="line-height:1.6;">
                <!-- پر شده توسط JS -->
            </div>
            
            <div style="margin-top:1.5rem; display:flex; gap:10px; justify-content:flex-end; border-top:1px solid var(--border); padding-top:1rem;">
                <button class="btn btn-secondary" onclick="closeRoomInfo()">Close</button>
            </div>
        </div>
    </div>
    
    <script src="/static/assets/app.js"></script>
    <script src="/static/plan/plan.js"></script>
</body>
</html>
