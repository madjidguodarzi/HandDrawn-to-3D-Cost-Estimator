<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Object Cost Sheet</title>
    <link rel="stylesheet" href="/static/assets/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* استایل‌های اختصاصی جدول */
        .editable-cell { cursor: pointer; border-radius: 4px; padding: 2px 5px; }
        .editable-cell:hover { background: #f1f5f9; }
        .editable-cell:focus { background: white; border: 1px solid var(--primary); }
        
        /* استایل مودال ویرایش */
        #editModal .card { max-width: 700px; }
        .form-grid { display:grid; grid-template-columns: 1fr 1fr; gap:15px; margin-bottom:15px; }
        .full-width { grid-column: span 2; }
    </style>
</head>
<body>
    <div class="container" style="max-width: 1400px;">
        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; border-bottom:1px solid var(--border); padding-bottom:1rem;">
                <h2 id="pageTitle" style="margin:0;"><i class="fa-solid fa-coins" style="color: var(--success);"></i> Cost Estimation</h2>
                <div class="controls">
                    <button class="btn btn-primary" onclick="addRow()"><i class="fa-solid fa-plus"></i> Add Item</button>
                    <button class="btn btn-success" onclick="saveAllCosts()"><i class="fa-solid fa-save"></i> Save Changes</button>
                </div>
            </div>
            
            <div class="table-container">
                <table id="costTable">
                    <thead>
                        <tr>
                            <th style="width:25%">Item Name</th>
                            <th style="width:10%">Qty</th>
                            <th style="width:10%">Unit</th>
                            <th style="width:12%">Price</th>
                            <th style="width:12%">Total</th>
                            <th style="width:8%">Days</th>
                            <th style="width:12%">Start Date</th>
                            <th style="width:8%">Pre.</th>
                            <th style="width:10%">Quality</th>
                            <th style="width:5%"></th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal ویرایش پیشرفته -->
    <div id="editModal" class="modal-overlay" style="display:none;">
        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
                <h3><i class="fa-solid fa-pen-to-square"></i> Edit Cost Item</h3>
                <button onclick="closeEditModal()" style="background:none; border:none; font-size:1.2rem; cursor:pointer;"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <input type="hidden" id="editIndex">
            
            <div class="form-grid">
                <div>
                    <label>Item Name:</label>
                    <input type="text" id="editItemName">
                </div>
                <div>
                    <label>Category:</label>
                    <input type="text" id="editCategory" placeholder="e.g., Tiling">
                </div>
                <div>
                    <label>Quantity:</label>
                    <input type="number" step="0.01" id="editQty">
                </div>
                <div>
                    <label>Unit:</label>
                    <select id="editUnit">
                        <option value="m2">m²</option>
                        <option value="m">m</option>
                        <option value="piece">Piece</option>
                        <option value="liter">Liter</option>
                        <option value="kg">kg</option>
                        <option value="hour">Hour</option>
                    </select>
                </div>
                <div>
                    <label>Unit Price:</label>
                    <input type="number" step="0.01" id="editPrice">
                </div>
                <div>
                    <label>Duration (Days):</label>
                    <input type="number" id="editDuration">
                </div>
                <div>
                    <label>Start Date:</label>
                    <input type="date" id="editStartDate">
                </div>
                <div>
                    <label>Predecessor ID:</label>
                    <input type="number" id="editPredecessor">
                </div>
                <div class="full-width">
                    <label>Material Quality:</label>
                    <input type="text" id="editQuality" placeholder="e.g., Premium, Standard">
                </div>
                <div class="full-width">
                    <label>Notes:</label>
                    <textarea id="editNotes" rows="2"></textarea>
                </div>
            </div>

            <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top:1rem;">
                <button class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveEditModal()">Save Changes</button>
            </div>
        </div>
    </div>

    <script src="/static/assets/app.js"></script>
    <script src="/static/plan/cost/cost.js"></script>
</body>
</html>
